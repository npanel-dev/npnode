Log:
  Level: warn
  Output:
  Access: none

Api:
  ApiHost:
  ServerID: 0
  SecretKey:
  Timeout: 30
  # 向面板声明 seat_v1（设备名额）。打开后：限速按 bit/s 解释（字节每秒 = speed_limit / 8），
  # 接收面板的分片推送，请求带 capabilities=seat_v1 与 X-Node-Agent。
  # 面板升级到支持设备名额的版本后再逐台打开；出问题改回 false 即恢复旧行为。
  SeatV1: false

Grpc:
  # 默认开启：用 gRPC 推送用户和配置变更、上报流量。Addr 留空时从 Api.ApiHost 推出（同一个域名）。
  # 面板没有开放 gRPC 时节点会自动改用 HTTP；要强制只用 HTTP 改成 false。
  Enable: true
  Addr:

PprofPort: 0
