Log:
  Level: warn
  Output:
  Access: none

Api:
  ApiHost:
  ServerID: 0
  SecretKey:
  Timeout: 30
  # 向面板声明 seat_v1（设备名额）。打开后：限速按 bit/s 解释（字节每秒 = speed_limit / 8），
  # 接收面板的分片推送，请求带 capabilities=seat_v1 与 X-Node-Agent。
  # 面板升级到支持设备名额的版本后再逐台打开；出问题改回 false 即恢复旧行为。
  SeatV1: false
  # 声明 online_v1：在线上报改为基于活跃连接（长连接、空闲连接每个周期都上报），上报周期不超过 60 秒，
  # 面板据此把本节点的在线数据用于名额并发冲突检测。与 SeatV1 相互独立；关闭时在线上报与旧版一致。
  OnlineV1: false
  # HTTP 流量上报带批次号（boot_id + 递增 sequence），失败后原样重发，面板可靠回执（traffic_report_mode=shadow/enforce）据此去重。
  # 与上面两项相互独立；关闭时 HTTP 流量请求体与旧版一致。gRPC 上报本来就带 report_id，不受影响。
  TrafficIdempotent: false
  # 声明 admission_v1：对 device_limit > 0 的条目实时准入（同一 (id, IP) 首连接 session/check、每 50～60 秒保活、
  # 最后一条连接关闭后 release；面板不可用时按本机规则降级），并在只改限速 / 设备数时原地更新、不断开连接。
  # 面板 seat_realtime_admission 默认打开，声明即生效，建议先少量灰度。与上面三项相互独立。
  AdmissionV1: false

Grpc:
  # 默认开启：用 gRPC 推送用户和配置变更、上报流量。Addr 留空时从 Api.ApiHost 推出（同一个域名）。
  # 面板没有开放 gRPC 时节点会自动改用 HTTP；要强制只用 HTTP 改成 false。
  Enable: true
  Addr:

PprofPort: 0
