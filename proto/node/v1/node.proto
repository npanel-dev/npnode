syntax = "proto3";

package npanel.node.v1;

option go_package = "github.com/npanel-dev/npnode/proto/node/v1;nodev1";

// NodeService provides the gRPC API for proxy nodes to communicate with the server.
service NodeService {
  // GetConfig returns the server configuration including protocols, DNS, outbound, etc.
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);

  // GetUserList returns all authorized users for this server.
  rpc GetUserList(GetUserListRequest) returns (GetUserListResponse);

  // Sync establishes a bidirectional stream for continuous data exchange.
  // The node sends traffic reports, online user updates, and status.
  // The server pushes config changes and user list updates.
  rpc Sync(stream SyncRequest) returns (stream SyncResponse);

  // ReportStatus reports server health status (CPU, memory, disk).
  rpc ReportStatus(ReportStatusRequest) returns (ReportStatusResponse);
}

// ========== GetConfig ==========

message GetConfigRequest {
  int64 server_id = 1;
  string secret_key = 2;
  repeated string protocols = 3; // optional filter: only return these protocols
  // 节点声明的能力（seat_v1 / online_v1 / admission_v1），未知值忽略
  repeated string capabilities = 4;
}

message GetConfigResponse {
  int64 traffic_report_threshold = 1;
  string ip_strategy = 2;
  repeated NodeDNS dns = 3;
  repeated string block = 4;
  repeated NodeOutbound outbound = 5;
  repeated Protocol protocols = 6;
  int64 total = 7;
  // 节点拉取配置/用户列表、上报流量的间隔（秒），0 时节点使用默认值。
  int64 pull_interval = 8;
  int64 push_interval = 9;
  // 设备准入开关：节点声明了任意能力时为 false（由节点自行判断准入），否则为后台原值
  bool device_admission_enabled = 10;
  // 设备计数模式，一律为后台原值
  string device_count_mode = 11;
}

message NodeDNS {
  string proto = 1;
  string address = 2;
  repeated string domains = 3;
}

message NodeOutbound {
  string name = 1;
  string protocol = 2;
  string address = 3;
  int64 port = 4;
  string password = 5;
  repeated string rules = 6;
}

message Protocol {
  string type = 1;
  uint32 port = 2;
  bool enable = 3;
  // TLS / Security
  string security = 4;
  string sni = 5;
  bool allow_insecure = 6;
  string fingerprint = 7;
  string reality_server_addr = 8;
  int32 reality_server_port = 9;
  string reality_private_key = 10;
  string reality_public_key = 11;
  string reality_short_id = 12;
  // Transport
  string transport = 13;
  string host = 14;
  string path = 15;
  string service_name = 16;
  // Shadowsocks
  string cipher = 17;
  string server_key = 18;
  // VLESS
  string flow = 19;
  // Hysteria
  string hop_ports = 20;
  int32 hop_interval = 21;
  string obfs_password = 22;
  // Transport options
  bool disable_sni = 23;
  bool reduce_rtt = 24;
  string udp_relay_mode = 25;
  string congestion_controller = 26;
  string multiplex = 27;
  // Advanced
  string padding_scheme = 28;
  int32 up_mbps = 29;
  int32 down_mbps = 30;
  string obfs = 31;
  string obfs_host = 32;
  string obfs_path = 33;
  string xhttp_mode = 34;
  string xhttp_extra = 35;
  // Encryption
  string encryption = 36;
  string encryption_mode = 37;
  string encryption_rtt = 38;
  string encryption_ticket = 39;
  string encryption_server_padding = 40;
  string encryption_private_key = 41;
  string encryption_client_padding = 42;
  string encryption_password = 43;
  // ECH
  bool ech_enable = 44;
  string ech_server_name = 45;
  // Certificate
  double ratio = 46;
  string cert_mode = 47;
  string cert_dns_provider = 48;
  string cert_dns_env = 49;
  bool proxy_protocol = 50;
}

// ========== GetUserList ==========

message GetUserListRequest {
  int64 server_id = 1;
  string secret_key = 2;
  string protocol = 3;
  // 入站端口：同一服务器同协议可能有多个端口，用户列表按端口区分。0 表示不区分。
  uint32 port = 4;
  // 节点声明的能力，决定用户条目的渲染口径
  repeated string capabilities = 5;
}

message GetUserListResponse {
  repeated UserEntry users = 1;
}

message UserEntry {
  int64 id = 1;
  string uuid = 2;
  int64 speed_limit = 3;
  int64 device_limit = 4;
}

// ========== Sync (Bidirectional Stream) ==========

message SyncRequest {
  oneof payload {
    TrafficReport traffic = 1;
    OnlineUserReport online_users = 2;
    StatusReport status = 3;
    // 订阅入站的用户变更推送；也用于版本断档后重新获取全量
    Subscribe subscribe = 4;
    // 入站证书状态（http / dns 模式申请 / 续期的结果）
    CertReport cert = 5;
    LogReport log = 6;
  }
}

// CertReport 一个入站的证书状态：申请失败时入站不启动（不使用自签证书），由面板展示原因。
message CertReport {
  string protocol = 1;
  uint32 port = 2;
  string domain = 3;
  string mode = 4;       // http / dns
  bool ok = 5;           // 证书可用（入站已用它启动）
  string error = 6;      // 失败原因；续期失败但旧证书仍有效时 ok=true 且带 error
  int64 not_after = 7;   // 证书到期时间（unix 秒），没有证书为 0
  int64 checked_at = 8;  // 节点检查时间（unix 秒）
}

// LogReport 一批节点故障事件与恢复信号
message LogReport {
  repeated LogEvent events = 1;
  string report_id = 2;   // 面板按 report_id 去重并回 Ack，未 Ack 用同一 ID 重发（同流量上报）
  repeated LogResolve resolves = 3;
}

// LogResolve 恢复信号：某个范围内的问题已经好了，面板把对应的未恢复事件标记为已恢复
message LogResolve {
  string scope = 1;       // server：节点整体启动成功；inbound：某入站启动成功；cert：某入站证书可用
  string protocol = 2;    // scope 为 inbound / cert 时必填
  uint32 port = 3;
  repeated string active_inbounds = 4; // scope=server 时附当前已启动的入站 "protocol:port"
  int64 resolved_at = 5;  // unix 毫秒
}

message LogEvent {
  string level = 1;       // error / warn / fatal
  string code = 2;        // 稳定错误码，如 VLESS_ENCRYPTION_MODE_EMPTY；无法归类为 UNKNOWN
  string stage = 3;       // config / core / inbound / cert / report / runtime
  string protocol = 4;    // 关联入站，可空
  uint32 port = 5;
  string message = 6;     // 原始错误文本（已脱敏）
  repeated string context = 7; // 事件前后的原始日志行（已脱敏，最多 50 行）
  int64 occurred_at = 8;  // unix 毫秒
  string version = 9;     // 节点版本
  bool exiting = 10;      // 节点因此事件退出
  uint32 count = 11;      // 节点节流窗口内该事件累计次数（≥1），面板 count += count
}

message Subscribe {
  repeated Inbound inbounds = 1;
}

message Inbound {
  string protocol = 1;
  uint32 port = 2;
  // 订阅该入站的会话声明的能力：能力不同的会话属于不同的推送通道
  repeated string capabilities = 3;
}

message TrafficReport {
  repeated TrafficEntry traffic = 1;
  // 入站协议与端口：面板按协议倍率计费
  string protocol = 2;
  uint32 port = 3;
  // 上报唯一 ID：面板去重并回 Ack；节点未收到成功 Ack 时用同一 ID 重发
  string report_id = 4;
}

message TrafficEntry {
  int64 uid = 1;   // user subscribe id
  int64 upload = 2;
  int64 download = 3;
}

message OnlineUserReport {
  repeated OnlineUserEntry users = 1;
  string protocol = 2;
  uint32 port = 3;
}

message OnlineUserEntry {
  int64 uid = 1;  // user subscribe id
  string ip = 2;
}

message StatusReport {
  double cpu = 1;
  double mem = 2;
  double disk = 3;
  int64 updated_at = 4;
  // 为空表示心跳（只用于保持连接，面板不覆盖状态）
  string protocol = 5;
  uint32 port = 6;
  // 节点程序版本，面板据此显示
  string version = 7;
}

message SyncResponse {
  oneof payload {
    UserListUpdate user_update = 1;
    ConfigUpdate config_update = 2;
    // 流量上报的处理结果
    Ack ack = 3;
    // 连接建立后面板立即发送，节点据此确认流可用
    ServerHello hello = 4;
    // 面板定期发送的保活消息：Cloudflare 等代理会断开长时间没有下行数据的流，节点忽略即可
    Ping ping = 5;
  }
}

message Ping {
  int64 sent_at = 1;
}

message Ack {
  string report_id = 1;
  bool ok = 2;
  string error = 3;
}

message ServerHello {
  int64 server_id = 1;
}

message UserListUpdate {
  // FULL：完整用户列表；DIFF：新增或变更后的用户
  repeated UserEntry users = 1;
  UserUpdateAction action = 2; // full or incremental
  // 所属入站
  string protocol = 3;
  uint32 port = 4;
  // 该入站用户集合的版本：DIFF 只能应用在“本地版本 + 1”上，否则节点重新订阅取全量
  uint64 version = 5;
  // DIFF：被删除或变更前的用户
  repeated UserEntry removed = 6;
  // 分片序号（从 1 开始）与总片数，只对声明了 seat_v1 的通道设置
  uint32 chunk_no = 7;
  uint32 chunk_total = 8;
}

enum UserUpdateAction {
  USER_UPDATE_FULL = 0;       // Replace entire list
  USER_UPDATE_ADD = 1;        // Add users
  USER_UPDATE_REMOVE = 2;     // Remove users
  USER_UPDATE_DIFF = 3;       // users 为新增/变更后，removed 为删除/变更前
}

message ConfigUpdate {
  string reason = 1; // why config was updated
  int64 server_id = 2;
}

// ========== ReportStatus ==========

message ReportStatusRequest {
  int64 server_id = 1;
  string secret_key = 2;
  string protocol = 3;
  double cpu = 4;
  double mem = 5;
  double disk = 6;
  int64 updated_at = 7;
}

message ReportStatusResponse {}
